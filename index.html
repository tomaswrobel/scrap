<!DOCTYPE html>
<html lang="en" style="background-color: black">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scrap - Loading...</title>
		<meta name="theme-color" content="#2fbf71" />
		<meta name="creator" content="Tomáš Wróbel" />
		<meta
			name="description"
			content="Scrap is an IDE designed to simplify the transition from Scratch to JavaScript."
		/>
	</head>
	<body style="opacity: 0">
		<div id="app" style="--output: 380">
			<iframe name="output" src="src/components/output/index.html" title="Output"></iframe>

			<!-- Tabs -->
			<div id="tabs"></div>

			<!-- Stage controls -->
			<div id="buttons">
				<a href="javascript:location.reload();" target="output">
					<img src="./src/assets/icons/stage/flag.svg" alt="Play" />
				</a>
				<a href="javascript:postMessage('STOP', '\u002a')" id="stop" target="output">
					<img src="./src/assets/icons/stage/stop.svg" alt="Stop" />
				</a>
				<a href="javascript:document.documentElement.requestFullscreen();" target="output">
					<img src="./src/assets/icons/stage/fullscreen.svg" alt="Fullscreen" />
				</a>
			</div>

			<!-- Stage -->
			<div id="stage">
				<span class="name">Stage</span>
			</div>

			<!-- Sprite Bar -->
			<div id="sprites">
				<div class="sprite-info"></div>
			</div>
			<button id="add" type="button" class="fab" title="New sprite...">+</button>

			<!-- Resize handler -->
			<div id="handler"></div>
		</div>
		<!-- Nav -->
		<ul role="navigation">
			<li><a href="javascript:;" title="Scrap"></a></li>
			<li class="dropdown">
				<a href="javascript:this.app?.dropdown(0)">File</a>
				<div class="dropdown-content">
					<a href="javascript:this.app?.dropdown(0);" id="open">Open</a>
					<a href="javascript:this.app?.dropdown(0);" id="save">Save</a>
					<a href="javascript:this.app?.dropdown(0);" id="export">Export HTML</a>
					<a href="javascript:this.app?.dropdown(0);" id="import">Import SB3</a>
				</div>
			</li>
			<li class="dropdown">
				<a href="javascript:this.app?.dropdown(1)">Mode</a>
				<div class="dropdown-content">
					<a href="javascript:this.app?.mode('paced')">
						<span class="checkmark" data-for="paced">&check;&nbsp;</span>
						Paced
					</a>
					<a href="javascript:this.app?.mode('turbo')">
						<span class="checkmark" data-for="turbo">&check;&nbsp;</span>
						Turbo
					</a>
				</div>
			</li>

			<li>
				<a href="https://github.com/tomaswrobel/scrap" target="_blank">GitHub</a>
			</li>
			<li class="input">
				<input type="text" placeholder="Project name" value="Project" />
			</li>
		</ul>
		<script src="./src/main.ts" type="module"></script>
	</body>
</html>
