[package]
name = "scrap-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
js-sys = "0.3"
# Keep in sync with @oxc-project/types in package.json (same AST shape).
oxc = { version = "0.147.0", features = [
	"ast_visit",
	"semantic",
	"transformer",
	"codegen",
	"serialize",
] }
getrandom = { version = "*", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"
serde = "1.0.228"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
