[package]
name = "scrap-compiler"
version = "0.1.0"
authors = ["Tomáš Wróbel"]
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
swc_core = { version = "35.0.0", features = [
	"ecma_parser",
	"ecma_ast",
	"common",
	"ecma_visit",
	"ecma_ast_serde",
	"ecma_transforms",
	"ecma_transforms_typescript",
] }
swc = "34.0.0"
getrandom = { version = "*", features = ["wasm_js"] }
anyhow = "1.0.100"
serde-wasm-bindgen = "0.6.5"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
