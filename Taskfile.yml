# https://taskfile.dev

version: "3"

dotenv:
  - .env
  - .env.local

tasks:
  setup:
    desc: Sets the repository for development for the first time
    cmds:
      - touch .env.local
      - pnpm install

  compiler:build:
    desc: Builds the compiler
    dir: src/compiler
    env:
      RUSTFLAGS: --cfg getrandom_backend="wasm_js"
    cmds:
      - wasm-pack build --out-name index
    sources:
      - src/compiler/src/*
      - src/compiler/Cargo.*
    generates:
      - src/compiler/pkg

  app:build:
    desc: Builds the app
    cmds:
      - pnpm vite build
    sources:
      - public/**/*
      - src/**/*
      - pnpm-lock.yaml
      - config/**/*
    generates:
      - dist/

  app:dev:
    desc: Serves the app
    cmds:
      - pnpm vite
    sources:
      - public/**/*
      - src/**/*
      - pnpm-lock.yaml
      - config/**/*
    generates:
      - dist/

  blockly:media-copy:
    requires:
      vars:
        - VITE_BLOCKLY_MEDIA_PATH
    desc: Copies the Blockly Media into /public
    cmds:
      - rm -rf public/$VITE_BLOCKLY_MEDIA_PATH
      - cp -r node_modules/blockly/media public/$VITE_BLOCKLY_MEDIA_PATH
      - echo "*" > public/$VITE_BLOCKLY_MEDIA_PATH/.gitignore
    sources:
      - node_modules/blockly/media/*
    generates:
      - public/{{.VITE_BLOCKLY_MEDIA_PATH}}/*

  intro:
    vars:
      APP_VERSION:
        sh: >
          node -e '
            const package = require("./package.json");
            console.log(package.version);
          '
      APP_NAME:
        sh: >
          node -e '
            const package = require("./package.json");
            console.log(package.displayName || package.name);
          '
    cmds:
      - echo "{{.APP_NAME}} v{{.APP_VERSION}} starting..."
    silent: true

  engine:build:
    desc: Builds the Scrap Engine
    cmds:
      - rm -rf public/engine
      - pnpm vite build --config=src/engine/vite.config.js
      - echo "*" > public/engine/.gitignore
    sources:
      - src/engine/*.{css,ts,js}
    generates:
      - public/engine/*

  build:
    desc: Builds the app to the production
    cmds:
      - task: intro
      - task: compiler:build
      - task: engine:build
      - task: blockly:media-copy
      - task: app:build

  dev:
    desc: Runs the app
    cmds:
      - task: intro
      - task: compiler:build
      - task: engine:build
      - task: blockly:media-copy
      - task: app:dev

  check:
    desc: Checks the code
    cmds:
      - pnpm oxlint --type-aware
      - pnpm svelte-check --tsconfig ./tsconfig.app.json
      - pnpm svelte-check --tsconfig ./tsconfig.node.json
      - pnpm prettier . --check

  fix:
    desc: Tries to fix as much code as possible
    cmds:
      - pnpm oxlint --fix
      - pnpm prettier . --write

  test:
    desc: Runs tests
    cmds:
      - pnpm tsx --test ./**/*.test.ts
